[project]
name = "contextual-data-fabric"
version = "0.1.0"
description = "Contextual Data Fabric — federated query engine (M5) and supporting modules."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "ArangoDB Solutions" }]
dependencies = [
    # SPARQL parsing / algebra for the query-graph partition planner (M5 / E1).
    "rdflib>=7.0,<8.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = ["ruff>=0.4", "mypy>=1.10"]
# The HTTP seam (M9/PRD §10.2). httpx is fastapi's TestClient transport.
service = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cdf.eval" = ["goldens/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Embedded HTML/CSS/JS page — long style/script lines are expected.
"deploy/demo/server.py" = ["E501"]
# Embedded R2RML fixture — long mapping lines are expected.
"tests/test_clickhouse.py" = ["E501"]

[tool.mypy]
# The live-source adapters lazy-import the owned engine libraries, which ship no
# type stubs; they are optional (not core deps) and only loaded on the live path.
[[tool.mypy.overrides]]
module = ["arango_sparql.*", "arango.*", "clickhouse_connect.*", "snowflake.*"]
ignore_missing_imports = true
