source_schema: public
collections:
  contracts:
    source_table: contracts
    target_collection: contracts
    collection_type: document
    is_join_table: false
    field_mappings: {}
    exclude_fields: []
    include_fields: null
    field_expressions: []
  # usage_metrics DELIBERATELY EXCLUDED (Sprint 2 / WP-S3): the UsageMetric concept
  # is owned uniquely by the live Snowflake source (deploy/csi/snowflake-telemetry.json).
  # The planner must never see one concept claimed by two sources.
  contacts:
    source_table: contacts
    target_collection: contacts
    collection_type: document
    is_join_table: false
    # Disambiguate the cross-source "role" collision: Contact.role (a contact's
    # relationship role) vs Document.role (arango). r2g maps {column: property}
    # and drives BOTH the CSI property and the R2RML predicate from this value
    # (r2g csi.py / r2rml.py), so `role` -> `contactRole` renames the label and
    # the predicate in lockstep while the physical column stays `role`. Takes
    # effect on the next CSI regeneration. See deploy/catalog/label-collisions.md.
    field_mappings:
      role: contactRole
    exclude_fields: []
    include_fields: null
    field_expressions: []
  nps_surveys:
    source_table: nps_surveys
    target_collection: nps_surveys
    collection_type: document
    is_join_table: false
    field_mappings: {}
    exclude_fields: []
    include_fields: null
    field_expressions: []
  opportunities:
    source_table: opportunities
    target_collection: opportunities
    collection_type: document
    is_join_table: false
    field_mappings: {}
    exclude_fields: []
    include_fields: null
    field_expressions: []
  accounts:
    source_table: accounts
    target_collection: accounts
    collection_type: document
    is_join_table: false
    field_mappings: {}
    exclude_fields: []
    include_fields: null
    field_expressions: []
# Edges derive from the FKs declared in deploy/mappings/crm-keys.overlay.json (the
# live schema declares none — RSA's inference misses natural-key references;
# see the overlay's header). usage_metrics_to_accounts is DELIBERATELY OMITTED:
# usage_metrics is not mapped in this source (UsageMetric is owned by Snowflake,
# WP-S3), so an edge referencing it would resurrect the dual-owner problem.
edges:
- edge_collection: contacts_to_accounts
  from_collection: contacts
  to_collection: accounts
  from_field: account_id
  to_field: account_id
- edge_collection: contracts_to_accounts
  from_collection: contracts
  to_collection: accounts
  from_field: account_id
  to_field: account_id
- edge_collection: nps_surveys_to_accounts
  from_collection: nps_surveys
  to_collection: accounts
  from_field: account_id
  to_field: account_id
- edge_collection: opportunities_to_accounts
  from_collection: opportunities
  to_collection: accounts
  from_field: account_id
  to_field: account_id
- edge_collection: opportunities_to_contracts
  from_collection: opportunities
  to_collection: contracts
  from_field: contract_id
  to_field: contract_id
type_overrides: {}
key_separator: _
naming_convention: null
