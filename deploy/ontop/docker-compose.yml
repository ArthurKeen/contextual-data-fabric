# Ontop (Apache-2.0 VKG) over a live Postgres — the M5 relational leg (WP-B1).
# Ontop answers SPARQL by rewriting to SQL against Postgres using the R2RML
# mapping in ./input/mapping.ttl (the shape r2g `export-r2rml` emits). No data
# is copied into the fabric.
#
#   1) drop the Postgres JDBC driver into ./jdbc  (see README.md)
#   2) docker compose up
#   3) ONTOP_SPARQL_ENDPOINT=http://localhost:8080/sparql \
#        .venv/bin/pytest tests/test_ontop_live.py
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: cdf
      POSTGRES_PASSWORD: cdf
    ports:
      # Host port is overridable: r2g's test Postgres commonly holds 5432.
      - "${CDF_POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdf -d crm"]
      interval: 5s
      timeout: 5s
      retries: 12

  ontop:
    image: ontop/ontop:5.5.0
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Host port overridable: 8080 is a common local collision.
      - "${CDF_ONTOP_PORT:-8080}:8080"
    environment:
      ONTOP_MAPPING_FILE: /opt/ontop/input/mapping.ttl
      ONTOP_PROPERTIES_FILE: /opt/ontop/input/ontop.properties
      ONTOP_CORS_ALLOWED_ORIGINS: "*"
      # Demo-only provenance seam: exposes /ontop/reformulate so the cited
      # PostgreSQL leg carries the SQL Ontop actually generated.
      ONTOP_DEV_MODE: "true"
    volumes:
      - ./input:/opt/ontop/input:ro
      - ./jdbc:/opt/ontop/jdbc:ro
